<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>D365FO Field Scanner — GitHub settings</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #191d27;
    --border: #262b38;
    --text: #e4e7ee;
    --text-dim: #8b93a7;
    --accent: #4f8cff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    max-width: 480px;
    margin: 40px auto;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.hint { color: var(--text-dim); font-size: 12.5px; margin-top: 0; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 13px; }
  label .hint { display: block; font-weight: 400; color: var(--text-dim); margin-top: 2px; }
  input {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .row { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; }
  #status { font-size: 12.5px; margin-top: 4px; }
  #status.ok { color: #6fd68a; }
  #status.err { color: #ff8080; }
</style>
</head>
<body>
  <h1>GitHub settings</h1>
  <p class="hint">Used by the "Save to GitHub" button to commit scan results and screenshots to a repository.</p>

  <label>
    Repository owner
    <span class="hint">Your GitHub username or organization.</span>
    <input type="text" id="owner" placeholder="slavashatokhin-hash" />
  </label>

  <label>
    Repository name
    <input type="text" id="repo" placeholder="d365fo-form-extractor" />
  </label>

  <label>
    Branch
    <span class="hint">Defaults to "main" if left blank.</span>
    <input type="text" id="branch" placeholder="main" />
  </label>

  <label>
    Personal access token
    <span class="hint">A fine-grained token scoped to just this repo, with Contents: Read and write permission.</span>
    <input type="password" id="token" placeholder="github_pat_..." autocomplete="off" />
  </label>

  <div class="row">
    <button class="primary" id="saveBtn">Save</button>
    <button id="testBtn">Test connection</button>
    <span id="status"></span>
  </div>

  <script src="github.js"></script>
  <script src="options.js"></script>
</body>
</html>

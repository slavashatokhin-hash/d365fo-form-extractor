<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>D365FO Field Scanner</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #191d27;
    --border: #262b38;
    --text: #e4e7ee;
    --text-dim: #8b93a7;
    --accent: #4f8cff;
    --accent-dim: #2c3e63;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    width: 480px;
    max-height: 560px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
  }
  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: 0.2px;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 11.5px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  button {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 7px 12px;
    cursor: pointer;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #06101f;
  }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:not(.primary):hover { background: #1f2430; }
  .status {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 11px;
  }
  #meta {
    padding: 8px 16px;
    color: var(--text-dim);
    font-size: 11px;
    border-bottom: 1px solid var(--border);
    display: none;
  }
  #meta span { color: var(--text); font-family: var(--mono); }
  #results {
    max-height: 400px;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:hover { background: #1a1f2b; }
  .control-name {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
  }
  .empty-cell { color: #4a5064; }
  #empty-state, #error-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    display: none;
  }
  #error-state { color: #ff8080; display: none; }
  .hint {
    font-size: 11px;
    margin-top: 6px;
  }
  .deep-option {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .deep-option input {
    margin-top: 2px;
  }
  .deep-option .hint {
    display: block;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 9.5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--accent-dim);
    color: #a9c4ff;
    vertical-align: middle;
  }
  #screenshots {
    max-height: 320px;
    overflow-y: auto;
    padding: 10px 16px;
    display: none;
    border-top: 1px solid var(--border);
  }
  #screenshots.has-shots { display: block; }
  .shot-card {
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  .shot-card img {
    width: 100%;
    display: block;
    cursor: zoom-in;
  }
  .shot-caption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    font-size: 11.5px;
  }
  .shot-caption a {
    color: var(--accent);
    text-decoration: none;
    font-size: 11px;
  }
  #combineBtn {
    margin: 8px 16px 0;
  }
  #optionsPanel {
    border-bottom: 1px solid var(--border);
  }
  #optionsPanel summary {
    padding: 8px 16px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    list-style: none;
  }
  #optionsPanel summary::-webkit-details-marker { display: none; }
  #optionsPanel summary::before {
    content: "▸ ";
  }
  #optionsPanel[open] summary::before {
    content: "▾ ";
  }
  #optionsPanel .deep-option:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>
  <header>
    <h1>D365FO Field &amp; Help Text Scanner</h1>
    <p>Reads control names, labels, and help text from the active form.</p>
  </header>

  <div class="toolbar">
    <button class="primary" id="scanBtn">Scan current form</button>
    <button id="csvBtn" disabled>Export CSV</button>
    <button id="jsonBtn" disabled>Copy JSON</button>
    <button id="lookupCsvBtn" disabled>Export Lookups CSV</button>
    <span class="status" id="status"></span>
  </div>

  <details id="optionsPanel">
    <summary>Scan options</summary>
    <label class="deep-option">
      <input type="checkbox" id="deepScan" checked />
      <span>
        Also hover fields to reveal tooltip-only help text
        <span class="hint">Slower — simulates hovering each field that has no help text in the page's HTML.</span>
      </span>
    </label>

    <label class="deep-option">
      <input type="checkbox" id="walkTabs" checked />
      <span>
        Try to auto-click through this form's tabs (experimental)
        <span class="hint">If the form uses a tab/FastTab strip, attempts to click each one and collect its fields. Falls back to the current tab if it can't detect one.</span>
      </span>
    </label>

    <label class="deep-option">
      <input type="checkbox" id="captureScreenshots" />
      <span>
        Capture a screenshot of each tab
        <span class="hint">Grabs what's visible in the browser viewport for each tab (not the full scrollable page). Slower — adds a short pause per tab.</span>
      </span>
    </label>

    <label class="deep-option">
      <input type="checkbox" id="captureLookups" />
      <span>
        Open lookup fields and capture their available values
        <span class="hint">Experimental — detects dropdown/lookup fields, opens each one, reads the values shown, and screenshots it if screenshots are also enabled. Can be slow on forms with many lookups.</span>
      </span>
    </label>

    <label class="deep-option">
      <input type="checkbox" id="mergeResults" />
      <span>
        Merge with previous scan results
        <span class="hint">Reliable manual fallback: click a tab yourself, scan, click the next tab, scan again — results accumulate instead of being replaced.</span>
      </span>
    </label>
  </details>

  <div id="meta"></div>
  <div id="resetRow" style="display:none; padding: 6px 16px; border-bottom: 1px solid var(--border);">
    <button id="resetBtn" style="font-size:11px; padding:4px 9px;">Clear accumulated results</button>
  </div>

  <div id="results"></div>
  <div id="lookupsResults"></div>
  <button id="combineBtn" style="display:none;">Download all screenshots (combined PNG)</button>
  <div id="screenshots"></div>

  <div id="empty-state">
    Click <strong>Scan current form</strong> while a Dynamics 365&nbsp;F&amp;O form is open in the active tab.
  </div>

  <div id="error-state"></div>

  <script src="popup.js"></script>
</body>
</html>
